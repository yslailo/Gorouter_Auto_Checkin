name: Multi-site New API Check-in

on:
  schedule:
    # 每日 UTC 22:45 = 北京时间 06:45
    - cron: '45 22 * * *'

  # 支持手动触发
  workflow_dispatch:

# ==========================================
# GitHub Actions 权限
# ==========================================
permissions:
  actions: write
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest

    # Turnstile 浏览器求解需要额外时间
    timeout-minutes: 15

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. 安装 Python 依赖
      # ==========================================
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 4. 安装系统依赖
      # ==========================================
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            fonts-noto-color-emoji \
            fonts-wqy-zenhei \
            fonts-unifont

      # ==========================================
      # 5. 获取 Camoufox 版本
      # ==========================================
      - name: Get Camoufox version
        id: camoufox-version
        run: |
          v=$(python -c "import importlib.metadata as m; print(m.version('camoufox'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Camoufox $v"

      # ==========================================
      # 6. Cache Camoufox 浏览器
      # ==========================================
      - name: Cache Camoufox browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-${{ steps.camoufox-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-camoufox-

      # ==========================================
      # 7. 下载 Camoufox 浏览器
      # ==========================================
      - name: Fetch Camoufox browser
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        run: |
          python -m camoufox fetch

      # ==========================================
      # 8. 从 GitHub Secret 写入 ACCOUNTS.json
      # ==========================================
      - name: Write ACCOUNTS.json from secret
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: |
          echo "========================================="
          echo "检查 ACCOUNTS Secret"
          echo "========================================="

          if [ -z "$ACCOUNTS" ]; then
            echo "❌ Secret ACCOUNTS 未配置"
            exit 1
          fi

          printf '%s' "$ACCOUNTS" > ACCOUNTS.json

          # 限制文件权限
          chmod 600 ACCOUNTS.json

          # ==========================================
          # 校验 JSON 格式
          # ==========================================
          python -c "
          import json

          with open(
              'ACCOUNTS.json',
              encoding='utf-8'
          ) as f:
              json.load(f)
          " || {
            echo "❌ ACCOUNTS 不是合法 JSON"
            exit 1
          }

          echo "✅ ACCOUNTS.json 就绪"

      # ==========================================
      # 9. 执行签到
      #
      # 使用 xvfb 提供虚拟显示器
      # Camoufox 以有头模式运行
      # ==========================================
      - name: Run check-in
        env:
          ACCOUNTS_FILE: ACCOUNTS.json
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHECKIN_PROXY: ${{ secrets.CHECKIN_PROXY }}
          CHECKIN_HEADLESS: 'false'
        run: |
          echo "========================================="
          echo "开始执行多站点签到"
          echo "========================================="

          xvfb-run -a \
            --server-args="-screen 0 1920x1080x24" \
            python checkin.py

          echo "========================================="
          echo "签到任务执行完成"
          echo "========================================="

      # ==========================================
      # 10. 清理敏感文件
      #
      # 无论前面成功还是失败都会执行
      # ==========================================
      - name: Cleanup credentials
        if: always()
        run: |
          echo "========================================="
          echo "清理敏感文件"
          echo "========================================="

          rm -f ACCOUNTS.json

          echo "✅ ACCOUNTS.json 已删除"

          echo "========================================="

      # ==========================================
      # 11. 清理旧 Workflow 运行记录
      # ==========================================
      - name: Clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "开始清理旧的 Workflow 运行记录..."

          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0

          for run_id in $runs; do
            count=$((count + 1))

            # 保留最新的一条运行记录
            if [ "$count" -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete "$run_id" || true
            fi
          done

          echo "✅ 历史运行记录清理完成"

      # ==========================================
      # 12. 自动保活
      #
      # 最后一次 commit < 40 天：
      #     不做任何事情
      #
      # 最后一次 commit >= 40 天：
      #     修改 keepalive.txt
      #     创建 commit
      #     push 到 main
      # ==========================================
      - name: Keep repository alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=============================="
          echo "开始检查仓库是否需要保活"
          echo "=============================="

          # 配置 Git 用户
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 获取远程 main 最新状态
          git fetch origin main

          # 确保当前处于 main
          git checkout main

          # 同步到远程最新代码
          git reset --hard origin/main

          # 获取最后一次 commit 的时间戳
          LAST_COMMIT=$(git log -1 --format=%ct)

          # 获取当前 UTC 时间戳
          NOW=$(date +%s)

          # 计算距离最后一次 commit 的天数
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))

          echo "最后一次 commit:"
          git log -1 --format='%h %ci %s'

          echo "距离最后一次 commit: ${DAYS} 天"

          # ==========================================
          # 超过 40 天才创建保活 commit
          # ==========================================
          if [ "$DAYS" -ge 40 ]; then

            echo "⚠️ 已超过 40 天没有 commit"
            echo "开始创建 Keepalive commit..."

            # 创建/更新保活文件
            mkdir -p .github

            echo "Keepalive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
              > .github/keepalive.txt

            # 添加文件
            git add .github/keepalive.txt

            # 检查是否真的有变化
            if git diff --cached --quiet; then
              echo "⚠️ 没有检测到文件变化，不创建 commit"
            else

              # 提交
              git commit \
                -m "chore: keep workflow alive [skip ci]"

              # 推送
              git push origin main

              echo "✅ Keepalive commit 创建成功"

            fi

          else

            REMAIN=$((40 - DAYS))

            echo "✅ 当前不需要创建 Keepalive commit"
            echo "距离 40 天阈值还有 ${REMAIN} 天"

          fi

          echo "=============================="
          echo "Keepalive 检查完成"
          echo "=============================="
