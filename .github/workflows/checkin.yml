name: Multi-site New API Check-in

on:
  schedule:
    # 每日 UTC 22:45 = 北京时间 06:45
    - cron: '45 22 * * *'

    # ==========================================
    # 每月 1 号北京时间 08:30
    # UTC 00:30 = 北京时间 08:30
    #
    # 用于 Workflow 保活
    # ==========================================
    - cron: '30 0 1 * *'

  # 支持手动触发
  workflow_dispatch:

# ==========================================
# GitHub Actions 权限
# ==========================================
permissions:
  actions: write
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    # Turnstile 浏览器求解需要额外时间
    timeout-minutes: 15

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================
      # 2. 清理上一次 Workflow 运行记录
      #
      # 当前这次运行已经启动，所以：
      # 当前 run_id = github.run_id
      #
      # 从历史记录中找到最近的一次其他运行
      # 并删除它。
      # ==========================================
      - name: Cleanup previous workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.workflow_id }}
        run: |
          echo "========================================="
          echo "开始清理上一次 Workflow 运行记录"
          echo "========================================="

          echo "当前 Run ID: ${CURRENT_RUN_ID}"
          echo "Workflow ID: ${WORKFLOW_ID}"

          # 获取最近的历史运行记录
          PREVIOUS_RUN_ID=$(gh run list \
            --repo "${REPOSITORY}" \
            --workflow "${WORKFLOW_ID}" \
            --all \
            --limit 20 \
            --json databaseId,createdAt \
            --jq "
              [.[] |
                select(.databaseId != ${CURRENT_RUN_ID})
              ]
              | sort_by(.createdAt)
              | reverse
              | .[0].databaseId
            ")

          # ==========================================
          # 判断是否找到上一次运行
          # ==========================================
          if [ -n "${PREVIOUS_RUN_ID}" ] && [ "${PREVIOUS_RUN_ID}" != "null" ]; then

            echo "找到上一次运行记录: ${PREVIOUS_RUN_ID}"

            gh run delete "${PREVIOUS_RUN_ID}" \
              --repo "${REPOSITORY}" \
              --confirm || true

            echo "✅ 上一次 Workflow 运行记录已删除"

          else

            echo "ℹ️ 没有找到上一次运行记录"

          fi

          echo "========================================="
          echo "运行记录清理完成"
          echo "========================================="

      # ==========================================
      # 3. 每月保活
      #
      # 每月 1 号触发时：
      # 不执行签到，只执行一次正常的 Actions Run
      #
      # 这样可以让 Workflow 保持活跃。
      # ==========================================
      - name: Keep workflow alive
        if: github.event_name == 'schedule' && github.event.schedule == '30 0 1 * *'
        run: |
          echo "========================================="
          echo "GitHub Actions 保活任务"
          echo "========================================="

          echo "当前 UTC 时间:"
          date -u

          echo "北京时间:"
          TZ=Asia/Shanghai date

          echo ""
          echo "✅ Workflow 保活成功"
          echo "本次仅执行保活，不执行签到"

          echo "========================================="

      # 仅在每日签到调度或手动触发时执行后续签到步骤（保活调度跳过）
      - name: Check-in gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 0 1 * *" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "本次为保活调度，跳过签到步骤"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "本次为签到任务"
          fi

      # ==========================================
      # 4. Setup Python
      #
      # 每天签到时才需要 Python
      # 保活任务不需要 Python
      # ==========================================
      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ==========================================
      # 5. 安装 Python 依赖（Turnstile 浏览器求解）
      # ==========================================
      - name: Install Python deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install system deps (Turnstile browser)
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-wqy-zenhei fonts-unifont

      - name: Get Camoufox version
        if: steps.gate.outputs.run == 'true'
        id: camoufox-version
        run: |
          v=$(python -c "import importlib.metadata as m; print(m.version('camoufox'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Camoufox $v"

      - name: Cache Camoufox browser
        if: steps.gate.outputs.run == 'true'
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-${{ steps.camoufox-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-camoufox-

      - name: Fetch Camoufox browser
        if: steps.gate.outputs.run == 'true' && steps.camoufox-cache.outputs.cache-hit != 'true'
        run: python -m camoufox fetch

      # ==========================================
      # 6. 从 GitHub Secret 写入 ACCOUNTS.json
      # ==========================================
      - name: Write ACCOUNTS.json from secret
        if: steps.gate.outputs.run == 'true'
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: |
          echo "========================================="
          echo "检查 ACCOUNTS Secret"
          echo "========================================="

          if [ -z "$ACCOUNTS" ]; then
            echo "❌ Secret ACCOUNTS 未配置"
            exit 1
          fi

          printf '%s' "$ACCOUNTS" > ACCOUNTS.json

          # 限制文件权限
          chmod 600 ACCOUNTS.json

          # ==========================================
          # 校验 JSON 格式
          # ==========================================
          python -c "
          import json

          with open(
              'ACCOUNTS.json',
              encoding='utf-8'
          ) as f:
              json.load(f)
          " || {
            echo "❌ ACCOUNTS 不是合法 JSON"
            exit 1
          }

          echo "✅ ACCOUNTS.json 就绪"

      # ==========================================
      # 7. 执行签到
      #
      # Turnstile 求解需要真实浏览器环境：headless 模式常被 Cloudflare
      # 风控拒绝，因此在虚拟显示（xvfb）下以有头模式运行 Camoufox
      # ==========================================
      - name: Run check-in
        if: steps.gate.outputs.run == 'true'
        env:
          ACCOUNTS_FILE: ACCOUNTS.json
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHECKIN_PROXY: ${{ secrets.CHECKIN_PROXY }}
          CHECKIN_HEADLESS: 'false'
        run: |
          echo "========================================="
          echo "开始执行多站点签到"
          echo "========================================="

          xvfb-run -a --server-args="-screen 0 1920x1080x24" python checkin.py

          echo "========================================="
          echo "签到任务执行完成"
          echo "========================================="

      # ==========================================
      # 8. 清理敏感文件
      #
      # 无论前面成功还是失败都会执行
      # ==========================================
      - name: Cleanup credentials
        if: always()
        run: |
          echo "========================================="
          echo "清理敏感文件"
          echo "========================================="

          rm -f ACCOUNTS.json

          echo "✅ ACCOUNTS.json 已删除"

          echo "========================================="
